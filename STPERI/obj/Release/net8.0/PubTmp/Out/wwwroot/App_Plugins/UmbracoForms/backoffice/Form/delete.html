<div class="umb-pane" ng-controller="UmbracoForms.Editors.Form.DeleteController as vm">
  <umb-load-indicator ng-if="vm.loading"></umb-load-indicator>
  <div ng-if="!vm.loading">
      <div ng-if="vm.canDelete">
        <p>
          <strong>{{vm.title}}</strong>
        </p>
        <div ng-if="!vm.deletingFolder">
          <p>
            <em><localize key="formDelete_timingNote"></localize></em>
          </p>
          <p>
            <localize key="formDelete_recordDeleteNote"></localize>
          </p>
          <p>
            {{vm.recordDetail}}
          </p>
        </div>
        <div class="abstract umb-alert umb-alert--warning" ng-if="vm.showWarningForRelations">
          <span>
            <localize key="formDelete_deleteWarning"></localize>
          </span>
        </div>
        <div class="btn-toolbar umb-btn-toolbar">
          <div class="control-group umb-control-group">
            <a href="" class="btn btn-link" ng-click="vm.cancelDelete()"><localize key="general_cancel">Cancel</localize></a>

            <umb-button action="vm.performDelete(currentNode.id)"
                        type="button"
                        button-style="danger"
                        state="vm.buttonState"
                        label="OK"
                        disabled="vm.buttonState === 'busy'">
            </umb-button>
          </div>
        </div>
      </div>
      <div ng-if="!vm.canDelete">
        <p ng-if="vm.deletingFolder"><localize key="formDelete_cannotDeleteFolder"></localize></p>
        <a href="" class="btn btn-info" ng-click="vm.cancelDelete()"><localize key="general_close">Close</localize></a>
      </div>
  </div>
</div>
